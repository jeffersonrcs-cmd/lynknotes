name: Deploy LynkNotes to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lynknotes-pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build SPA for GitHub Pages
        run: bun run build
        env:
          VITE_BASE_PATH: /lynknotes/
          VITE_SUPABASE_URL: https://ipqrxdozzlenmanykgoz.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.JSLYNK_SUPABASE_PUBLISHABLE_KEY }}

      - name: Prepare and validate static output
        run: |
          test -s dist/index.html
          cp dist/index.html dist/404.html
          test -s dist/404.html
          grep -q "/lynknotes/" dist/index.html
          echo "SPA entry point and fallback validated."
          find dist -maxdepth 2 -type f | sort | head -80

      - name: Publish to JSLynk/lynknotes
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: dist
          force_orphan: true
          enable_jekyll: false
