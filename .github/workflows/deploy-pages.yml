name: Trigger LynkNotes GitHub Pages deployment

on:
  workflow_run:
    workflows:
      - Automatic semantic version
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lynknotes-pages-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deployment in JSLynk/lynknotes
        env:
          GH_TOKEN: ${{ secrets.LYNKNOTES_PAGES_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url https://api.github.com/repos/JSLynk/lynknotes/dispatches \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"event_type":"deploy-lynknotes"}'
