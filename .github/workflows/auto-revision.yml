name: Automatic semantic version

on:
  push:
    branches: [main]
    paths-ignore:
      - "version-history.json"
      - "VERSION_HISTORY.md"
      - "public/version-history.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: automatic-version-policy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  version:
    if: github.actor != 'github-actions[bot]' && (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Detect changes since the last recorded version
        id: range
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="$(git log -1 --format=%H -- version-history.json)"
          AFTER="$(git rev-parse HEAD)"
          if [ -z "$BEFORE" ]; then
            BEFORE="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
          fi
          echo "before=$BEFORE" >> "$GITHUB_OUTPUT"
          echo "after=$AFTER" >> "$GITHUB_OUTPUT"
      - name: Run versioning tests
        run: npm test
      - name: Validate current version and history
        run: node scripts/bump-version.mjs check
      - name: Calculate and validate semantic version
        run: node scripts/bump-version.mjs auto --before "${{ steps.range.outputs.before }}" --after "${{ steps.range.outputs.after }}"
      - name: Commit version and history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json version-history.json VERSION_HISTORY.md
          if git diff --cached --quiet; then
            echo "No version changes to commit."
            exit 0
          fi
          git commit -m "chore(version): automatic semantic version [skip ci]"
          git push origin HEAD:main
